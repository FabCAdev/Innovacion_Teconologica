name: "CI — ODS11 Plataforma Reciclaje (Node.js)"

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # ESTO ES LO QUE ARREGLA EL ERROR:
    # Le dice a GitHub Actions que todos los comandos y búsquedas de archivos 
    # se ejecuten dentro de la carpeta 'ods12-project'
    defaults:
      run:
        working-directory: ods12-project

    strategy:
      matrix:
        node-version: [18, 20]

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          # Le indica a la caché dónde buscar específicamente el package-lock.json
          cache-dependency-path: ods12-project/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Verificación de tipos TypeScript
        run: npm run type-check

      - name: Linting
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Build de producción
        run: npm run build

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build-node${{ matrix.node-version }}
          # Ajustamos la ruta para que guarde la carpeta compilada desde la subcarpeta
          path: ods12-project/.next/
          retention-days: 7
